baseURL = "https://otechai.github.io/marocwire"
locale = "en-us"
title = "MarocWire"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

pagination.pagerSize = 10

[minify]
  disableXML = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "MarocWire"
  description = "Morocco's official gazette, translated into news for Moroccan expats and the international public — investment, infrastructure, water, and MRE policy, sourced straight from government paperwork."
  keywords = ["Morocco", "Bulletin Officiel", "MRE", "Moroccan expats", "Morocco news", "Morocco investment", "OCP", "Morocco water", "Morocco business"]
  author = "Otmane Echaibi"
  images = ["img/marocwire-cover.jpg"]
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  UseHugoToc = true
  disableSpecial1stPost = false
  hidemeta = false
  comments = false
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "MarocWire 🇲🇦"
    Content = "Morocco's Official Gazette, translated into plain English for Moroccan expats and the international public. New investment rules, mega-projects, water policy, and everything affecting Moroccans abroad — sourced directly from government filings, before it hits the mainstream press."

  [params.profileMode]
    enabled = true
    title = "MarocWire"
    subtitle = "News from Morocco's Official Gazette — for the diaspora and the world"
    imageUrl = "img/marocwire-logo.png"
    imageWidth = 150
    imageHeight = 150
    imageTitle = "MarocWire"
    buttons = [
      { name = "Digests", url = "posts" },
      { name = "About", url = "about" },
      { name = "Categories", url = "categories" }
    ]

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.editPost]
    URL = "https://github.com/marocwire/otechai.github.io/tree/main/content"
    Text = "Suggest a correction"
    appendFilePath = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon.ico"
    favicon32x32 = "favicon.ico"
    apple_touch_icon = "apple-touch-icon.png"
    disableFingerprinting = false

  [params.analytics.google]
    SiteVerificationTag = ""   # Google Search Console verification string

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/otechai"

[[params.socialIcons]]
  name = "email"
  url = "mailto:otmanova@proton.me"

[[params.socialIcons]]
  name = "rss"
  url = "index.xml"

[[params.socialIcons]]
  name = "buymeacoffee"
  url = "https://www.buymeacoffee.com/otechai"

# [[params.socialIcons]]
#   name = "x"
#   url = "https://x.com/marocwire"
#
# [[params.socialIcons]]
#   name = "telegram"
#   url = "https://t.me/marocwire"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Digests"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
